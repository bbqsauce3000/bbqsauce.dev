<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Floating Ralsei Plush</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #spawnBtn {
      background: #000000;
      color: #ffffff;
      border: 1px solid #ffffff;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
    }

    .plush {
      position: fixed;
      width: 150px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<button id="spawnBtn">spawn ralsei</button>

<script>
  const btn = document.getElementById("spawnBtn");

  btn.addEventListener("click", () => {
    spawnFloatingPlush();
  });

  function spawnFloatingPlush() {
    const img = document.createElement("img");
    img.src = "ralseiplush.png"; // PNG version
    img.className = "plush";

    document.body.appendChild(img);

    let x = Math.random() * (window.innerWidth - 150);
    let y = Math.random() * (window.innerHeight - 150);

    let dx = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? -1 : 1);
    let dy = (Math.random() * 2 + 1) * (Math.random() < 0.5 ? -1 : 1);

    function animate() {
      x += dx;
      y += dy;

      if (x <= 0 || x >= window.innerWidth - 150) dx *= -1;
      if (y <= 0 || y >= window.innerHeight - 150) dy *= -1;

      img.style.left = x + "px";
      img.style.top = y + "px";

      requestAnimationFrame(animate);
    }

    animate();
  }
</script>

</body>
</html>
